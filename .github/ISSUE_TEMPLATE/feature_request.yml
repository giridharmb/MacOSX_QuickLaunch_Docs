name: 💡 Request a feature
description: An idea that would make QuickLaunch better.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the problem or workflow, not just the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How should it work?
  - type: textarea
    id: alternatives
    attributes:
      label: What do you do today instead?
