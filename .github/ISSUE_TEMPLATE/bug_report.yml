name: 🐞 Report a problem
description: Something in QuickLaunch isn't working as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this! Please check the [troubleshooting guide](https://giridharmb.github.io/MacOSX_QuickLaunch_Docs/support.html) first.
        **Don't include passwords, tokens or other private data — issues are public.**
  - type: input
    id: version
    attributes:
      label: QuickLaunch version
      description: Settings › About
      placeholder: "1.3.0 (4)"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: "macOS 26.1"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: |
        1. Recorded ⌃⌥⌘C for Google Chrome
        2. Pressed it in Safari
        3. Nothing happened (status icon was green)
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Shortcuts / hotkeys
        - Conflict detection
        - Leader key / launcher / cheat sheet
        - iCloud sync
        - Window cycling / placement
        - Menu bar menu
        - Preferences
        - Updates
        - Other
  - type: input
    id: others
    attributes:
      label: Other keyboard or launcher tools you run
      placeholder: "Raycast, Karabiner-Elements, BetterTouchTool…"
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
